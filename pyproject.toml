[project]
name = "ledger-api"
version = "0.1.0"
description = "The Python Lambdas of ledger-api, moving over from TypeScript one at a time"
requires-python = ">=3.13"
# boto3 comes with the Lambda runtime; the rest is bundled for arm64 Linux at synth (lib/python-code.ts).
dependencies = [
    "boto3>=1.43.119",
    "pydantic>=2.14.1",
    "pyjwt>=2.10",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
# Only the MCP function's bundle carries the SDK: it is most of the bundle's size, and so of every cold start.
mcp = ["mcp>=2.3.0"]
dev = [
    { include-group = "mcp" },
    "boto3-stubs[dynamodb,dynamodbstreams,sesv2,ssm]>=1.43.119",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/node_modules", "**/__pycache__", "cdk.out"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
