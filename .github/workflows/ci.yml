name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      dynamodb-local:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:integration

  # Deploys main after the tests pass. Needs, in the repo's settings:
  #   secret   AWS_DEPLOY_ROLE_ARN  (output of the LedgerApiCiAccess stack; a secret so the
  #                                  account ID in it never appears in this public repo's logs)
  #   secret   SMOKE_TEST_PASSWORD  (password for the smoke-test user)
  #   variable DEPLOY_ENABLED       ("true" once the above are set; job-level `if` can't read secrets)
  #   variable ALARM_EMAIL          (where alarms are emailed; optional)
  #   variable ADMIN_EMAIL          (where sign-ups are emailed for approval; optional)
  deploy:
    # Skipped until the one-time setup in README.md is done.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: test
    runs-on: ubuntu-latest
    # One deploy at a time; a newer push waits for the running one instead of racing it.
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      id-token: write # lets the job get a GitHub OIDC token to assume the AWS role
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2
          # Also hides the account ID wherever later steps print it (e.g. ARNs in cdk output).
          mask-aws-account-id: true
      - name: Deploy
        run: npx cdk deploy LedgerApi --require-approval never -c alarmEmail="$ALARM_EMAIL" -c adminEmail="$ADMIN_EMAIL" --outputs-file cdk-outputs.json
        env:
          ALARM_EMAIL: ${{ vars.ALARM_EMAIL }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
      - name: Smoke test
        run: API_URL="$(jq -r .LedgerApi.ApiUrl cdk-outputs.json)" npm run smoke
        env:
          SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
